{% extends "base.html" %}
{% block title %}Add Vehicle{% endblock %}
{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card tg-card p-4">
        <h3 class="fw-bold mb-3">Add Vehicle</h3>
        <form method="post" novalidate>
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}
          </div>
          {% endfor %}
          <button type="submit" class="btn btn-accent">Save Vehicle</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
