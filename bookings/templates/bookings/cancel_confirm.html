{% extends "base.html" %}
{% block title %}Cancel Booking{% endblock %}
{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card tg-card p-4 text-center">
        <h4>Cancel booking {{ booking.booking_reference }}?</h4>
        <p class="text-muted">This action cannot be undone. Your slot will be released for other customers.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger me-2">Yes, Cancel Booking</button>
          <a href="{% url 'bookings:booking_detail' booking.pk %}" class="btn btn-outline-secondary">Keep Booking</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
